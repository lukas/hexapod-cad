[project]
name = "hexapod-cad"
version = "0.1.0"
description = "Mechanical design, CAD pipeline, BOM and BuildViz scenes for the STS3215 hexapod (split from lukas/hexapod on 2026-09-15)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "trimesh>=4.0",
    "manifold3d>=2.5",           # trimesh boolean backend; without it the CAD emits parts with NO bolt holes
    "rtree>=1.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
    "scikit-image>=0.22",
    "pyvista>=0.44",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "pillow>=10",
    "pyyaml>=6",
    "build123d>=0.9",            # STEP/BREP exporters (build_step_prototype.py, concepts/*, tools/*)
    "embreex>=4.4; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "mujoco==3.11.0",            # mesh_mujoco/build_mesh_model.py self-checks
    "wireviz>=0.4,<0.5",         # scripts/render_harness_diagram.py (also needs graphviz `dot` on PATH)
]

[project.optional-dependencies]
# Bridges into the robot repo (joint contract, servo ids, sim env for load
# extraction): strength/extract_mujoco_loads.py, tools/full_robot_viz_build.py,
# scripts/render_harness_diagram.py, wire_harness_plan.py. Needs ../hexapod
# checked out next to this repo.
sim = ["hexapod"]

[tool.uv.sources]
hexapod = { path = "../hexapod", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Bare-module import style (`import hexapod_prototype`, `import _verify_prototype`,
# `import full_robot_viz_build`) from any cwd, mirroring the layout the scripts
# had at hexapod_walker/prototype_sts3215/ in the robot repo.
dev-mode-dirs = [".", "tools", "scripts"]
packages = ["strength", "fasteners"]
