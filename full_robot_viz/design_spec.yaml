    cots: true
    qty: 1
    description: "Screen stand ('hex' is historical): round \u00d8115 top disc matching the plate below, on 3 blade legs at az 90/210/330 (28 mm, shortened from 72 in the late-Aug 2026 design review to cut the lever arm on the magnet-held plate). Mounts with 3x M3x8 SHCS driven up from under the plate into blind self-tap pilots in the feet. Screen on the top face, held by 4x M2 self-tappers in corner pilot holes, its 8-wire Uno pigtail entering through the 24x5 slot behind the panel's +X edge (MPU is glued on chassis_top, not under this plate)."
  hip_clamp_cap:
    label: "hip clamp cap"
    role: "frame"
    cots: false
    qty: 6
    description: "Printed clamp cap that clamshells the hip servo cradle (bolts to the cradle wall ends), capturing the servo body. Aug 18\u201319 2026: a 10 mm-wide L-shaped back-face hook near the wire end \u2014 5.5 mm wall + shelf lapping 7.4 mm over the back of the motor flush with its surface (the wire-end band steps up \u2014 no bite; plug-cable corridor open beside it, clear of the yoke pad sweep), plus a tiny corner pad at the horn end (1 mm press-fit bite, gap to the passive horn) that clamps the body against the front lip; 1 mm 45\u00b0 chamfers on the outer face's vertical edges so the sweeping yoke spine can't catch. Sep 2026 service refit: the holder's \u00d824 horn bore is open to the +Y clamp mouth, so after removing the two clamp bolts the servo, fitted horn and this cap lift out together; the slot removes one small front-case capture site and leaves the other three."
  hip_servo:
