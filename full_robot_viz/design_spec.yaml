  chassis_bottom:
    label: "chassis bottom"
    role: "chassis"
    cots: false
    qty: 1
    description: "Structural 200 mm flat-to-flat hex deck (single merged print) with 6 integrated STS3215 front-face-mount yaw cradles + upward yaw-bearing towers, one per leg at each hex-edge midpoint. Each STS3215 inserts from BELOW (output UP), bolts via 4x M2.5 through the cradle front plate, body hangs DOWN through a body cutout; the bolt-on yaw_servo_retainer stirrup captures it. A folded 4 mm floor makes the printed bottom one flush flat face so it prints flat, tower-up, no supports (Jun 2026 flush-bottom fix; check_flat_bottom overhang = 0.00 mm). Aug 16 2026: \u00d89 full-stack seat pads restore the 4 brass-standoff seats that the inboard-shifted harness ports had clipped (each pad nibbles one port corner; connectors still pass)."
  chassis_standoff:
    label: "chassis standoff"
    role: "electronics"
    cots: true
    qty: 4
    description: "32 mm M3 brass standoff between chassis_bottom and chassis_top at CHASSIS_STANDOFF_HOLES_XY (\u00b131.1) \u2014 the inter-plate structure. COTS."
  chassis_top:
    label: "chassis top"
    role: "chassis"
    cots: false
    qty: 1
    description: "Hex top plate that closes the chassis; carries the trunk power Wagos + motor controller and the 4 magnet posts for the hex board (per-leg power Wago pairs live below, on the chassis_bottom corner flats)."
  coxa_link:
    label: "coxa link"
    role: "frame"
    cots: false
    qty: 6
    description: "ONE-PIECE printed coxa (Aug 2026 merge of the old coxa_yaw_hub + coxa_hip_bracket): the yaw turntable hub (bolts the driven \u00d820 disc horn on the \u00d814 / 4x M3 circle, rides the touching 6805 pair (25x37x7, Aug 2026 thick-section swap) on a \u00d825.15 press-fit boss) fused to the hip servo cradle. Aug 17 2026 sink pass: the cradle rides 5 mm lower -- its foot slab fuses through the full platform band and the hip-servo well floor sits 2 mm over the platform top (+26), so the 5 vertical head-access shafts are only ~5.3 mm deep above the M3x30 horn-screw heads (any driver fits) and the part is 5 mm shorter. Aug 17 2026 scrape fix: the running gaps between the rotating link and the stationary yaw_bearing_cap widened to 1.5 mm axial (platform underside over the cap rim) and 1.0 mm radial (dust-skirt bore over the Phi 44 ring) after the printed parts scraped. The horn-screw seats are 1.25 mm deeper (bench: printed seats + screw tolerance ate ~1 mm of horn bite; corner tips now just break the disc's far face, the centre seat goes 1 mm deeper into the spline tap). Aug 16 2026 flatten: the cradle's 4x M2.5 end-face bolt holes and the DS3225-era wire-exit corridor are deleted -- a clean 4-wall box. Aug 17 2026: the cradle grew the SAME rear retention tab as the femur knee cradle (user: 'copy that same part ... so I can screw into the servo from both sides') -- a vertical 5.5 mm plate on the back-face side taking 2x M2.5x6 self-tappers into the hip servo's rear molded hole pair nearer the inboard/wire end, heads flush in Phi 5.2 x 2 mm recesses (connector-end pair stays open for the bus harness; the swinging femur arm passes ~1.5 mm over the tab's outer face)."
  disc_horn_hip:
    label: "disc horn hip"
    role: "horn"
    cots: true
    qty: 6
    description: "Driven \u00d820 25T aluminium disc horn on the hip servo output; the femur hip yoke bolts to it. COTS."
  disc_horn_knee:
    label: "disc horn knee"
    role: "horn"
    cots: true
    qty: 6
    description: "Driven \u00d820 25T aluminium disc horn on the knee servo output; the tibia knee yoke bolts to it. COTS."
  disc_horn_yaw:
    label: "disc horn yaw"
    role: "horn"
    cots: true
    qty: 6
    description: "Driven \u00d820 25T aluminium disc horn on the yaw servo output; the coxa hub bolts to it (\u00d814 / 4x M3). COTS."
  femur_link:
    label: "femur link"
    role: "frame"
    cots: false
    qty: 6
    description: "The WHOLE femur as ONE printed part (Jul 2026 merge #2 of the old hip yoke + knee bracket): the hip-end yoke straddles the hip servo (top arm bolts the driven disc horn, bottom arm the passive horn; 8 mm spine plate since Aug 2026, and both horn pads reach 0.5 mm/side deeper \u2014 YOKE_PAD_EXTRA_REACH, bench fit \u2014 to close the measured ~1 mm clevis-to-horn gap), a SOLID \u00d818 spar with small cone flares at both ends bridges the full 90 mm hip-to-knee span, and the knee-end cradle mounts the knee servo + 688 bearing housing. Aug 2026: a rear tab under the knee servo's open back face takes 2\u00d7 M2.5\u00d76 self-tappers into the rear molded hole pair nearer the spar (the connector-end pair stays open for the bus harness; the tab reaches 4.5 mm past the servo's wire-end face \u2014 Aug 17 2026 bench remeasure: the flat back-face ledge before the ~1.8 mm case step is just under 5 mm, not the ~4 mm read off the photo, so the 1 mm-longer tab now fully encloses both screw holes instead of the old open keyhole slots \u2014 its wall riser is capped 3.5 mm above the servo base for the wire-end shell flare, and the heads sit FLUSH in \u00d85.2 \u00d7 2 mm recesses like the output plate's 4 countersunk case screws: the tab is 5.5 mm thick = 3.5 shank + 2 head pocket, keeping the M2.5\u00d76's pilot bite unchanged), and the knee well's far (+X) wall is one flat solid face: full-width buttress thickness, no DS3225-era wire channel (the knee cables leave via the back-face ports through the open back). No sockets, no slip fits, no retention pins anywhere in the femur."
  foot_boot:
    label: "foot boot"
    role: "frame"
    cots: false
    qty: 6
    description: "TPU 95A standard spherical-ended boot pressed over the tibia tube end -- nominal \u00d89 mm rounded tip is the ground contact (Aug 2026; replaces the hinged foot fitting + pad + M3x16 pin)."
  hex_mount_plate:
    label: "hex mount plate"
    role: "electronics"
    cots: true
    qty: 1
    description: "Round \u00d8115 mm board (2 mm, matches the chassis_top disc) held by 4 magnets on 20 mm posts; carries Uno Q + breakout on top and the 3.3 V Wago underneath. Late-Aug 2026: 4 underside registration bosses socket the magnet tops (shear goes to plastic, magnets only carry pull); legacy 49.5 mm bolt square dropped. Review round 2: 3 stand-foot holes (M3x8 up into the stand's self-tap pilots), the Uno Q's 3-point UNO mount holes (M3x8 down into thumb nuts; the separate io board is retired), 2 \u00d88 wire ports at the south rim, E/W zip-tie slots. Print-only (SVG cut file retired)."
  hex_post_magnet:
    label: "hex post magnet"
    role: "electronics"
    cots: true
    qty: 4
