  route-trunk-vp-lipo-switch:
    purpose: "power trunk V+ 12-14 AWG: under-belly LiPo pair (XT60 Y-harness) -> UP through the 14 x 22 battery pass-through at (48, 0) -> over the deck rim at az 0 -> anti-spark switch"
  route-trunk-vp-switch-wago:
    purpose: "power trunk V+ 12-14 AWG: switch -> 15-20 A main fuse (inline) -> central trunk V+ nut = the SOUTH 5-port Wago 221-415 at (16, -16), nearest the switch"
  route-trunk-gnd-lipo-wago:
    purpose: "power trunk GND 12-14 AWG: under-belly LiPo pair -> UP through the (48, 0) battery pass-through -> out the az-0 bay to the corner tray, climbing PAST the switch holster's +X face (x 85) -> back west along the deck SOUTH of the holster (y <= -14) -> around the WEST side of the V+ nut -> central trunk GND nut = the NORTH 5-port Wago at (16, +16) (no switch/fuse in the GND leg)"
  route-logic-battery-uno-vp:
    purpose: "battery tap at the trunk nuts (V+ = south, GND = north) -> over the round plate's az-60 rim (between the raised-platform legs, r ~ 59) -> EAST of the breakout (x > 23) -> over the board's east end -> Uno Q power header: V+ on VIN, GND on the adjacent GND pin (no buck; 20 AWG; Uno Q accepts the 3S rail via its own regulator) [V+]"
  route-logic-battery-uno-gnd:
    purpose: "battery tap at the trunk nuts (V+ = south, GND = north) -> over the round plate's az-60 rim (between the raised-platform legs, r ~ 59) -> EAST of the breakout (x > 23) -> over the board's east end -> Uno Q power header: V+ on VIN, GND on the adjacent GND pin (no buck; 20 AWG; Uno Q accepts the 3S rail via its own regulator) [GND]"
  route-uart-uno-adapter-tx:
    purpose: "Uno Q MCU UART from the digital-header pins D1(TX)/D0(RX)/GND (feetech_bridge, 1 Mbps bus / 921600 to Linux) -> over the round plate's -X rim -> south around the adapter -> UART/MCU header on the adapter's +X servo face (jumper A; USB-C is bench-only -- VIN power gives no USB host mode / no VBUS) [TX]"
  route-uart-uno-adapter-rx:
    purpose: "Uno Q MCU UART from the digital-header pins D1(TX)/D0(RX)/GND (feetech_bridge, 1 Mbps bus / 921600 to Linux) -> over the round plate's -X rim -> south around the adapter -> UART/MCU header on the adapter's +X servo face (jumper A; USB-C is bench-only -- VIN power gives no USB host mode / no VBUS) [RX]"
  route-uart-uno-adapter-gnd:
    purpose: "Uno Q MCU UART from the digital-header pins D1(TX)/D0(RX)/GND (feetech_bridge, 1 Mbps bus / 921600 to Linux) -> over the round plate's -X rim -> south around the adapter -> UART/MCU header on the adapter's +X servo face (jumper A; USB-C is bench-only -- VIN power gives no USB host mode / no VBUS) [GND]"
  route-data-head-sig:
    purpose: "bus head: adapter servo plug -> over the switch holster (top deck0+21.5, velcro mount; the hex-plate underside leaves a 9 mm lane) -> down SOUTH of the az-0 corner Wago mount (mount spans y +/-22.3, x 79-102) -> inboard of the L0 yaw tower -> L0 drop slot -> L0 data Wago (S+GND only; adapter is data-only on the robot) [S]"
  route-data-head-gnd:
    purpose: "bus head: adapter servo plug -> over the switch holster (top deck0+21.5, velcro mount; the hex-plate underside leaves a 9 mm lane) -> down SOUTH of the az-0 corner Wago mount (mount spans y +/-22.3, x 79-102) -> inboard of the L0 yaw tower -> L0 drop slot -> L0 data Wago (S+GND only; adapter is data-only on the robot) [GND]"
  route-i2c-imu-gnd:
    purpose: "Uno Q I2C from the digital-header pins SCL/SDA/GND -> diagonally over the board -> over the round plate's SE rim (r ~ 59, between the raised-platform legs) -> GY-521 MPU glued on chassis_top beside the trunk Wagos (28 AWG; MPU VCC comes off the 3.3 V Wago instead, route-3v3-mpu) [GND]"
  route-i2c-imu-scl:
    purpose: "Uno Q I2C from the digital-header pins SCL/SDA/GND -> diagonally over the board -> over the round plate's SE rim (r ~ 59, between the raised-platform legs) -> GY-521 MPU glued on chassis_top beside the trunk Wagos (28 AWG; MPU VCC comes off the 3.3 V Wago instead, route-3v3-mpu) [SCL]"
