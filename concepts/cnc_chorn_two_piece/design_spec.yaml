split_joint:
  plane_z: -6.37
  tongue:
    width_x: 2.8
    length_y: 24.0
    height_z: 2.0
    pocket_clearance_per_wall: 0.15
    purpose: carries in-plane shear and makes the two plates self-locating
  retention:
    quantity: 2
    fastener: M2.5x6 DIN 7984 low-head SHCS
    access: passive outer face at the far web; no horn-hole alignment involved
  mass:
    drive_frame_g: 32.5
    passive_plate_g: 16.8
    assembled_g: 49.3
    one_piece_baseline_g: 48.0
    delta_g: 1.3

assembly_order:
  - Bolt the drive frame to the driven horn; only one four-hole pattern is live.
  - Bolt the passive plate to the passive horn; only that pattern is live.
  - Seat the broad tongue into the drive-frame receiver.
  - Install the two M2.5x6 split screws from the passive outer face.
  - Attach the printed femur/tibia part to Datum A using the inherited web joint.

service_intent:
  - Peripheral horn screws are a one-time installation and can remain in place.
  - Repeated joint separation uses the two centre horn-retention screws and the two split screws.
  - No eight-hole simultaneous clocking step remains.

verification:
  part_checks:
    - both BREP parts heal to watertight closed volumes
    - zero seated overlap between split parts
    - driven and passive horn bolt patterns are independently open
    - tongue is present and receiver pocket is clear
    - split screw axes and metal cover are open
    - passive plate has a straight axial assembly path
  inherited_robot_checks:
    - hip clamp clear from -112.5 through +35 deg
    - knee clamp and socket clear from -50 through +40 deg
    - full yaw range at least +/-40 deg; software remains +/-35 deg
    - adjacent legs remain at least 5 mm apart
    - printed web joint, caps, plate descent and hatch removal unchanged

needs_before_release:
  - FEA or physical proof-load test of tongue root and split-screw peel loading
  - add/quote a generous tongue-root fillet and matching pocket tool radius
  - bench-fit the 0.15 mm pocket clearance and 38.04 mm horn span
  - verify low-head screw grip and thread engagement on machined coupons
  - repeated teardown test with threadlocker policy and torque specification
  - do not send the current STEP bundle for machining as a production release
