name: STS3215 two-piece CNC chorn experiment
status: experimental_not_for_machining_release
inherits: concepts/cnc_chorn_overhead
units: mm

intent:
  problem: >-
    The one-piece clamp requires four driven-horn and four passive-horn
    holes to be clocked at the same time through a rigid 38.04 mm span.
  change: >-
    Split the clamp at the passive blade.  The driven horn receives an
    L-shaped drive frame; the passive horn receives its own plate.  The
    passive plate then enters a broad keyed receiver and is retained by
    two accessible low-head screws.
  unchanged:
    - full cnc_chorn_overhead robot and 42 mm outboard hip station
    - 4x M3 on 14 mm PCD per horn face
    - nominal 38.04 mm disc-face span; no rigid horn preload
    - printed-part web interface and its four fasteners
    - femur limit -110 deg; knee and yaw limits

