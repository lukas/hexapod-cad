build:
  id: prototype_sts3215/sensor-full-foot
  name: Ground-contact foot with TPU return and travel stop
  units: mm
  status: geometric bench prototype; trigger force and retention unvalidated
intent: Detect ground contact; no calibrated force measurement.
parts:
  sensor_full_foot:
    purpose: Rigid rounded moving foot supports the sensor and provides guide bores, stop face and TPU retaining groove.
    manufacturing: 3D printed
    material: PETG
    dimensions:
      diameter_mm: 19
      hemispherical_radius_mm: 9.5
      guide_bore_diameter_mm: 2.4
      guide_center_radius_mm: 7
  mating_cylinder:
    purpose: Closed rod socket transmits load to central sensor pad. Pins guide motion; outer rim stops compression. No glued joint to foot.
    manufacturing: 3D printed
    material: PETG
    dimensions:
      bore_mm: 8.2
      rod_nominal_od_mm: 8
      outer_diameter_mm: 16
      cylinder_height_mm: 20
      wire_slot_start_y_mm: 3.8
      pressure_pad_backing: full circular area
      rod_socket_depth_mm: 17.2
      travel_stop_gap_mm: 0.6
      pin_diameter_mm: 2
      pin_tip_clearance_at_stop_mm: 0.1
  return_collar_tpu:
    purpose: Flexible snap-on collar retains and returns both rigid halves; wire window preserves tail route.
    manufacturing: 3D printed
    material: TPU
    dimensions:
      maximum_od_mm: 22.8
      wire_window_width_mm: 7.1
    assumptions: TPU printing availability assumed. Rest shape only; spring rate, deformation, retention and fatigue untested.
  contact_pad_tpu:
    purpose: Compliant central actuator loads only the assumed active sensing disk before the rigid travel stop engages.
    manufacturing: 3D printed
    material: TPU
    dimensions:
      diameter_mm: 6.5
      thickness_mm: 1
      initial_sensor_gap_mm: 0.2
      compression_at_stop_mm: 0.4
  sensor_reference:
    purpose: Purchased film sensor reference; do not print.
    manufacturing: purchased
    dimensions:
      outside_diameter_mm: 10
      assumed_active_diameter_mm: 8.5
      assumed_film_plus_adhesive_thickness_mm: 0.2
      tab_width_mm: 6.5
    assumptions: Active diameter is inferred from user inner-diameter measurement; not modeled as an actual hole. Tab length and film thickness are illustrative.
limitations:
  - Rigid stop limits travel but does not establish a safe force limit.
  - TPU return force and friction affect contact threshold; bench calibration required.
  - Guides must slide; do not glue the moving joint.
  - No robot motion or control software changes.
