  coxa_link:
    label: "coxa_link_rigid — rounded corners + seat ring + dust brim + short column (concept)"
    aliases: ["rigid coxa", "rounded coxa", "coxa link rigid", "servo holder"]
    description: >-
      The production coxa_link with four variant edits.  (1) ENVELOPE
      ROUND: its two servo-cradle corner edges are rounded to a
      38.2 mm arc about its own yaw axis (ROT_ENVELOPE_R): boolean
      intersection with the envelope cylinder removes at most 2.16 mm
      from corners that used to reach 40.36 mm.  Introduced to clear
      the since-deleted corner pillars (the user chose rounding the
      servo holder over scalloping the pillar); KEPT after the
      Aug-26 pillar delete -- it costs nothing, and any future rim
      furniture inherits the >= 5 mm clearance guarantee (still
      asserted).  (2) HUB SEAT RING: a phi 29 ring from coxa-local z 2.5
      (the top of the single bottom bearing, now seated on the
      chassis tower's deck-level ledge -- Aug 25) up to z 5.0, 1 mm
      inside the dropped cradle slab; it bears only on the
      phi 25..29 inner-race land, the same contact the production
      uflange made higher up, and replaces the deleted
      yaw_bearing_cap's retention.  The PRESS onto the inner race is
      the production phi 25.15 wide boss itself, which already spans
      the relocated race band down to the deck plane -- no new
      collar, no wall-thickness risk.  (3) DUST BRIM (user, Aug 24
      rev 2: the earlier phi 44 skirt+curtain continued the tower
      cylinder and made the joint read as one tall chassis column --
      deleted): with the tower rim at the race-top plane the
      bearing is fully housed, so all that remains coxa-side is a
      phi 38 x 2 mm brim hovering 0.5 above the rim/race plane,
      stepped 3 mm inside the tower phi 44.  It roofs the 2RS seal +
      outer-race band and touches nothing; the 0.5 gap rides out
      print tolerance and bearing play.  (4) SHORT COLUMN (user,
      Aug 24 rev 3: the band ~25..40 above the deck was "largely
      unnecessary"; rev 4: "shorten the screws thats fine, that
      middle section is pointless"; Aug 25: shortest screw wins):
      the production phi 52.4 dust-lip skirt + 6 mm platform disc
      are deleted (they guarded the vacated upper-race position),
      the yaw-horn screws swap M3x30 -> M3x20 with every seat plane
      10 mm deeper (tip planes and horn thread engagement
      production-identical -- asserted), the hub boss is truncated
      at coxa-local 4.75, and the cradle slab + hip servo drop 14 mm
      as one rigid body, so the servo well floor sits 1.25 mm over
      the M3x20 heads -- the minimum for this screw stack (M3x16
      would sink the rotating slab below the static tower rim).
      Horn drive AT the horn (bolt pattern + tip depths), cradle
      pilots and cap seat are untouched; the screw head-access
      shafts and shank clearances are re-cut through the dropped
      slab from the deeper seat planes.  NOTE: this makes the coxa a
      VARIANT print (6x) AND a purchased-hardware change (30x M3x20
      SHCS replace the M3x30s; M3x30s and M3x25s no longer fit),
      replacing the stock coxa_link on this build.
    generated_by:
      file: "concepts/rigid_hip/build_rigid_hip_step.py"
      function: "make_coxa_link_rigid"
      output_stl: "stl/coxa_link_rigid.stl"
    features:
      envelope_round:
        label: "Cradle-corner rounding arc"
        kind: "fillet"
        purpose: >-
          Caps the coxa's reach from its yaw axis; kept after the
          pillar delete as the standing rotating-envelope guarantee.
        dimensions:
          envelope_radius:
            label: "Yaw-axis envelope radius"
            value: 38.2
            code_name: ROT_ENVELOPE_R
      hub_seat_ring:
        label: "Phi 29 bottom-race seat ring"
        kind: "boss"
        purpose: >-
          Runs from the ledge-seated race top (coxa-local z 2.5) up
          into the dropped cradle slab (z 5.0, 1 mm past the slab
          underside) so hanging-leg loads run cradle -> ring -> inner
          race -> outer race -> deck ledge with no bolt-on cap.  ID 24
          merges the ring into the boss wall; OD 29 = the inner-race
          land, 2 mm clear of the phi 33 outer-race band and its seal.
        dimensions:
          ring_od:
            label: "Ring OD (inner-race land)"
            value: 29.0
            code_name: HUB_RING_OD
          ring_z0:
            label: "Ring underside (coxa-local z) = race top"
            value: 2.5
            code_name: HUB_RING_Z0
      short_column:
        label: "Shortened hub column (skirt + platform deleted, M3x20 screws, slab dropped)"
        kind: "cut"
        purpose: >-
          Deletes the production phi 52.4 dust-lip skirt + platform
          disc (a dust guard for the vacated production upper-race
          position -- the phi 38 brim already roofs the relocated
          race), swaps the horn screws M3x30 -> M3x20 with the seat
          planes 10 mm deeper (tips + horn engagement unchanged --
          check_coxa_column asserts seat drop == length delta),
          truncates the hub boss 0.75 into the slab, and drops the
          entire slab + cradle + hip servo unit 14 mm so the well
          floor sits COL_HEAD_CL over the M3x20 heads.  Lowers the
          hip axis, cap, top plate and hatch by the same
          14 mm (shorter, stiffer sandwich).  Verified by
          check_coxa_column on every rebuild.
        dimensions:
          col_drop:
            label: "Column shrink (whole stack drops by this)"
            value: 14.0
            code_name: COL_DROP
          horn_bolt_len:
            label: "Yaw-horn screw length (M3x20 SHCS, was M3x30 -- hardware change)"
            value: 20.0
            code_name: HORN_BOLT_LEN
          head_seat_z:
            label: "Drive-screw head seat (coxa-local z, 10 mm deeper)"
            value: 7.75
            code_name: HORN_HEAD_SEAT_Z
          head_clearance:
            label: "Well floor clearance over the M3x20 heads"
            value: 1.25
            code_name: COL_HEAD_CL
      dust_brim:
        label: "Phi 38 non-contact dust brim over the housed race"
        kind: "shroud"
        purpose: >-
          Roofs the 2RS seal + outer-race band, hovering 0.5 above the
          race-top / tower-rim plane.  Touches neither chassis nor
          race -- a contact wiper would drag, squeak and wear.  OD 38
          (race OD + 2x gap) stops 3 mm inside the tower phi 44, so
          the brim reads as part of the rotating coxa, not as a
          continuation of the chassis column (the old phi 44 curtain
          did exactly that and was deleted).
        dimensions:
          brim_od:
            label: "Brim OD (race OD 37 + 2x gap)"
            value: 38.0
            code_name: BRIM_OD
          gap:
            label: "Running gap over rim and race, axial"
            value: 0.5
            code_name: BRIM_GAP
          brim_bottom_z:
            label: "Brim underside (coxa-local z; rim/race top at 2.5)"
            value: 3.0
            code_name: BRIM_BOT_Z
