          description: "Phi 9 OD x 20 mm sleeve; Phi 8.1 bore slides over the Phi 8 CF tube (same nominal slip fit as the tibia yoke socket; printed TPU still grips snugly from extrusion undersize; a dab of CA/epoxy for keeps)."
