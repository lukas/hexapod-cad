            mates_to: "STOCK passive 20 mm metal disc horn (centre bore over the STS3215 rear idler boss, flush on the back face); 4 x M3 SHCS into the disc's tapped holes -- identical to the top-arm interface"
            mating_plane_z_local_mm: -2.0
        - name: tibia_tube_socket
          type: cylindrical_boss
          description: "Phi 18 OD socket boss extending toward +X at z = JOINT_SOCKET_Z = 17.15 (yoke mid-plane; moved +1 mm by the Jul 2026 stock-horn refit); Phi 8.1 bore accepts the tibia Phi 8 CF tube (EPOXY-ONLY retention -- Aug 2026, user: 'remove the tiny hole ... im just gonna glue it'; the Phi 2.6 transverse pin cross-hole at x = 49 is REMOVED, which also deletes the stress riser field crack #1's socket branch ran through) running to the foot end (pressed-on TPU foot_boot).  Aug 2026: wall thickened 3 -> 5 mm (LEG_TUBE_SOCKET_WALL, boss Phi 14 -> Phi 18) -- first read as the crack fix; the user then pinned the field crack on the SPINE PLATE the boss tees into (see spine_plate_doubler, the real fix).  The thicker boss is kept on its own merits: FEA puts the tube-exit fulcrum at the boss mouth at ~14 MPa under a 2g strike, the highest-stressed spot on the part."
          centre_mm: [52.0, 0.0, 17.15]
          length_mm: 20.0
          diameter_mm: 18.0
          inner_diameter_mm: 8.1
          axis: x
          mating_face:
            normal: +x
            mates_to: "tibia Phi 8 mm carbon-fibre tube (epoxy bond only -- no retention pin since Aug 2026); other end takes the pressed-on TPU foot_boot"
            mating_plane_z_local_mm: 17.15
        - name: spine_plate_doubler
          type: extruded_rectangle
          description: "Aug 2026, THE fix for field crack #1 (user-corrected location: the photo shows VERTICAL splits through the 4 mm spine plate -- the yoke's flat front face -- above and below the tube socket, out to the arm edges; the earlier boss thickening never touched the plate).  Mechanism: a motion-plane foot strike bends the tube about the pivot axis and the socket boss pries the plate top/bottom, splitting it along vertical layer seams (same thin-plate T-junction failure as the femur knee-well far wall).  Fix: the spine plate is DOUBLED 4 -> 8 mm, extended OUTBOARD x 46 -> 50 (TIBIA_YOKE_SPINE_PAD_T = 4; inboard is forbidden by the Jun 2026 clamp-cap ROM refit, outboard is measured-free per the closed-yoke ROM survey).  CalculiX before/after (2g motion-plane foot strike, artifacts/strength/tibiayoke_*): spine crack-path peak 4.9 -> 2.1 MPa (-57%), p95 -63%; boss-mouth fulcrum 14.3 -> 5.3 MPa (-63%, now backed by the thick plate); vs 22.7 MPa derated yield.  Socket mouth (x = 42) and bore unchanged -- CF tube cut length stays put (the pin cross-hole was later REMOVED entirely; epoxy-only, no drilling).  FEA re-run after the pin removal (tibiayoke_nopin): spine crack-path peak 1.4 MPa, boss-mouth fulcrum 6.8 MPa vs 22.7 MPa derated yield.  (The femur hip yoke gained the same 8 mm plate later in Aug 2026 -- see femur_link hip_spine.)"
          centre_mm: [46.0, 0.0, 17.15]  # plate spans x [42, 50], y +/-12, z [-11, 45.3]
          length_mm: 8.0                # doubled thickness along x (was 4)
          width_mm: 24.0
          thickness_mm: 56.3            # full spine height, z -11 .. 45.3
          axis: x

  foot_boot:
    description: "TPU 95A standard spherical-ended boot pressed over every tibia CF-tube end (Aug 2026 -- replaces tibia_foot_fitting + foot_pad + the M3 x 16/nyloc hinge pin; 12 printed parts + 12 fasteners retired).  One revolved solid: a sleeve over the last FOOT_BOOT_SOCKET_DEPTH = 20 mm of the Phi 8 tube (Phi 8.1 bore = the SAME nominal slip fit as the tibia yoke's tube socket; printed TPU lands snug -- dab of CA/epoxy for keeps), closed by a FOOT_BOOT_TIP_L = 8 mm solid tip ending in a nominal Phi 9 rounded/spherical ground-contact end.  The bore's blind end is a 45-deg internal cone (mouth-down printing, no bridges).  Local frame: origin at the tube end on the tube axis; tube enters from -X, furthest rounded tip at +8.  All six legs use this same boot and the same 150 mm knee-centre-to-furthest-tip length."
    qty: 6
    bounds_mm: [28.0, 9.0, 9.0]         # x in [-20, +8] (20 mm socket + 8 mm tip), Phi 9 OD (FOOT_BOOT_OD)
    holes: []                            # the Phi 8.1 tube bore opens at -X (blind; not a through-hole)
    wire_channels: []
    keep_out_volumes: []
    shape:
      overall_form: "Solid of revolution about X: Phi 9 OD sleeve/tip with a Phi 8.1 x 20 mm blind bore (nominal slip fit over the Phi 8 tube -- matches the tibia yoke socket; 0.4 mm lead-in chamfer at the mouth; 45-deg internal cone at the blind end) and an 8 mm solid tip ending in a rounded/spherical Phi 9 ground-contact end whose furthest point is the kinematic tip."
