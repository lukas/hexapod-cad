  servo_clamp_cap:
    description: "ONE shared cap for both the hip and knee sandwich joints (12 printed; scene names hip_clamp_cap / knee_clamp_cap; make_servo_clamp_cap).  A T-shaped part in the shared well-local frame: a full-width FLANGE bar (CLAMP_CAP_T = 5 thick) spanning the cradle's +/-X wall ends on the servo body's open +Y face, a centre TONGUE reaching -Y into the open face, and a top LIP roofing the cradle's open +Y drop-in slot; a Phi HORN_CLEAR_OPENING_OD = 24 bore keeps the Phi 20 disc horn free.  PRESS FIT (Jun 2026 snug-fit pass): the tongue does NOT stop flush at the seated body face (+SERVO_BODY_D/2 = +12.4) -- it reaches CLAMP_TONGUE_INTERF = 0.5 mm PAST it, so bolt tension clamps the body against the -Y wall with zero slop (the old flush tongue left a 1.5-2 mm rattle; Aug 26 2026: interference reduced 1.0 -> 0.5 mm because at 1 mm the tongue bottomed on the rigid body before the flange met the wall ends and the cap top visibly BOWED around the screws when tightened); CLAMP_SEAT_DROP = 1 mm drops the tongue past z = 0 as a -Z backstop lip, and WELL_INSIDE_X_TIGHTEN = 1 mm total narrows the well X clearance 0.7 -> 0.2 mm/side.  BOLTING: 2 x M3 x 8 SHCS self-tap (axis Y) at (x, z) = (+/-CLAMP_BOLT_X = 27.2, CLAMP_BOLT_Z = 17.15) -- from servo_clamp_bolt_centres(), the SINGLE SOURCE shared with the cradle pilots (Phi 2.5 x 12) and fastener_registry, guarded by check_clamp_cap_alignment; NEVER hardcode copies.  Head counterbores (Phi 6 x 3) recess the heads FLUSH with the +Y face -- proud heads BRUSHED the sweeping femur/tibia yokes, which clear the flange by only ~3 mm at closest ROM.  BACK-FACE HOOK (Aug 18 2026, user: 'a small extra part that goes over part of the back of the motor ... without blocking where the wires come out'): the tongue's 1 mm CLAMP_SEAT_DROP backstop becomes an L-shaped hook over well-local x in [-17.7, -7.7] (10 mm wide, rev 4 Aug 19, user: 'reduce the width of that tab to 10mm to give more room for the servo plug'): a WALL dropping CLAMP_BACK_HOOK_T = 5.5 mm past the back plane (y >= tongue_y0 = +11.9, the flat-rim strip; 5.5 = the rear tab's proven plane, 1.5 mm over the yoke arm's inner face at z = -7) plus an inboard SHELF (rev 3-4: 'it has to go over the back of the servo ... come down 5mm further closer to the middle') reaching y >= CLAMP_BACK_HOOK_Y0 = +5.0 -- 7.4 mm OVER the back of the motor toward its middle.  Rev 8 (Aug 19, user: 'the bigger hook cant come 1mm [inside] it needs to be flush with the top'): the shelf's top face rides FLUSH with the back plane at z = 0 -- the STS back steps up within this wire-end band, so the rev-6 1 mm press bite jammed; flush skims the surface and still blocks -Z back-out immediately.  (History: rev 3 sat 2.2 mm down to clear the assumed platform -- ~2 mm of float, not a hold; rev 5 rode 1 mm down; rev 6 bit 1 mm inside -- jammed on the bump.)  HORN-SIDE MINI HOOK (rev 7, Aug 19, user: 'add a tiny hook on the other side where the passive servo horn is ... right at the end and leave a gap for the servo horn'): a second corner pad at the +X end, x +18.5..+22.9, y >= +9.4, z -1..+1 (1 mm press-fit bite -- kept at rev 8: 'the small hook is perfect because the sts motor doesnt have a bump there'; bottoms at the tongue-lip plane because the yoke pad sweep covers the whole +X end of the back face below z = -2) with its inner corner at r 11.2 from the output axis -- a >= 1.2 mm radial gap to the Phi 20 passive horn.  This pad alone preloads the body against the cradle's front retaining lip; the flush wire-end shelf takes the back-out load.  YOKE-SWEEP EDGE CHAMFERS (Aug 19, user: 'rounding the edge on the side where the yoke passes helps make sure theres not small friction'): the six vertical edges standing on the outer +Y face -- the two flange ends, the two wire-end hook wall edges (below z = 0 only) and the two horn-pad edges -- carry a 1 mm 45-deg chamfer (CLAMP_YOKE_EDGE_CHAMFER) so the yoke spine, which sweeps across that face with ~3 mm at closest ROM, cannot catch a corner if it grazes; horizontal edges are parallel to the sweep and stay square, mating faces stay sharp.  The whole x > -7.7 corridor stays OPEN so the 5264 plugs (bay centred (x -10, y 0), housings to y ~ +/-5) plug straight in below the shelf and their cables bend out beside the tab, not under it -- it laps the back face's flat +Y-edge rim (proven flat by the seated 1 mm lip; the raised ~1.8 mm centre platform stops short of it), stays clear of the 5264 wire bay (cluster centred (x -10, y 0), plugs leave straight out the back), outside the swinging yoke pad sweep (r 16.75 about the output axis; nearest hook corner r ~18.1), clear of the Phi 20 passive horn, and 0.5 mm clear of the cradle's rear retention tab (+X edge -18.2).  ROLE: at BOTH joints the cap + retaining lip + output-face seat are the primary retention (the Jul/Aug 2026 passes retired ALL end-face body screws), backed by the cradle's rear tab (2 x M2.5 x 6 into the rear molded pair) and this hook."
    qty: 12
    bounds_mm: [63.4, 16.9, 43.8]       # measured (on disk, well-local): x in [-31.7, 31.7] (= +/-WELL_W/2), y in [5.0, 21.9] (back-hook shelf 7.4 mm over the back face, out to the flange face), z in [-5.5, 38.3] (back-face hook to well rim + plate).
    holes:
      - name: clamp_bolt_+X
        diameter_mm: 3.4                # = CLAMP_BOLT_CLEAR_OD (M3 x 8 self-tap into the cradle wall-end pilot; head cb Phi 6 x 3 flush with the +Y face); mirrored at -X
        position_mm: [27.2, 16.5, 17.15]
        axis: y
    wire_channels: []
    keep_out_volumes: []
    shape:
      overall_form: "T-shaped bar, 63.4 mm wide: 5 mm flange plate against the servo body's +Y face, centre press-fit tongue reaching 1 mm past the body face, top lip over the drop-in slot, Phi 24 horn-clearance bore about the output axis (x = 12.5), a 10 mm-wide L-shaped back-face hook at the -X end (x -17.7..-7.7): 5.5 mm wall past the back plane + a shelf topping FLUSH at z 0 lapping 7.4 mm over the back of the motor toward its middle, and a tiny horn-side corner pad at the +X end (x 18.5..22.9, z -1..+1, 1 mm bite, >= 1.2 mm gap to the Phi 20 passive horn)."
      print_orientation_rationale: "Lay flat on the flange's broad face (shortest Z).  MJF PA12 preferred (isotropic, no layer-shear plane across the tongue); PLA OK."
      features:
        - name: flange_bar
          type: extruded_rectangle
          description: "Full-width bar (WELL_W = 63.4 long, CLAMP_CAP_T = 5 thick in Y) bearing on the cradle's +/-X wall ends; carries the 2 M3 bolt bores + flush head counterbores."
          centre_mm: [0.0, 19.4, 17.15]
          length_mm: 63.4               # = HP.WELL_W
          width_mm: 5.0                 # = HP.CLAMP_CAP_T
          height_mm: 39.3
          axis: y
          mating_face:
            normal: -y
            mates_to: "cradle +/-X wall-end faces (2 x M3 x 8 self-tap into the Phi 2.5 x 12 wall pilots)"
          holes_on_feature: [clamp_bolt_+X]
        - name: press_fit_tongue
          type: extruded_rectangle
          description: "Centre tongue reaching -Y to 0.5 mm PAST the seated body's +12.4 face (CLAMP_TONGUE_INTERF; 1.0 -> 0.5 Aug 26 2026, the cap top bowed around the screws at 1 mm) so bolt tension preloads the body against the -Y wall; drops 1 mm past z = 0 (CLAMP_SEAT_DROP) as an anti-drop backstop lip, grown into the Aug 18-19 2026 L-shaped back-face hook over x -17.7..-7.7 (5.5 mm wall + inboard shelf under the platform reaching y +5; see description).  The old cap lip variant buried ~560 mm^3 inside the cradle's own plate -- do not regress."
          centre_mm: [12.5, 12.0, 17.15]
          width_mm: 10.5
          thickness_mm: 5.5             # tongue Y depth in front of the flange inner face (= part Y extent 10.5 - CLAMP_CAP_T 5)
          axis: y
          mating_face:
            normal: -y
            mates_to: "STS3215 body +Y face (1 mm interference press fit)"
            mating_plane_z_local_mm: 12.4
        - name: horn_clearance_bore
          type: open_clearance
          description: "Phi 24 (= HORN_CLEAR_OPENING_OD = DISC_HORN_OD + 4, assert-guarded) opening about the output axis so the Phi 20 driven disc horn spins free."
          centre_mm: [12.5, 16.5, 36.3]
          diameter_mm: 24.0             # = HP.HORN_CLEAR_OPENING_OD
          axis: y

  yaw_servo_retainer:
    description: "Anti-rotation SADDLE under each hanging yaw servo (make_yaw_servo_retainer; supersedes BOTH the strap and the capture stirrup -- the stirrup sealed its own bolt axis from below, needing a ~38 mm screw down 34 mm of part, and held the case with 1 mm axial slop).  The yaw servo CANNOT FALL -- it hangs from its output shaft via the disc horn -> coxa hub -> yaw bearing pair -> chassis tower -- so the saddle's jobs are ANTI-ROTATION (reaction torque), anti-wobble, anti-drop backstop, and positive capture; the yaw cradle takes NO M2.5 end-face bolts (the flush-horn refit dropped the servo so the end-face hole rows land at the floor edge with no wall behind the head).  GEOMETRY (cradle-local frame, origin on the yaw axis): a U-channel hugging the case at SADDLE_BODY_CL = 0.12 mm per face -- the snugness IS the anti-rotation key -- with 3 mm walls on +/-Y and -X (3 key faces; +X open), walls running SADDLE_CASE_LEN_FIX = 3 mm past SERVO_BODY_H because the real case is ~2.7 mm longer than the frozen 34.3 mm STEP hole-plane gap (fix locally via yaw_servo_real_back_z(); NEVER stretch SERVO_BODY_H itself -- it is a kinematic anchor).  A 3 mm anti-drop backstop floor is opened into a perimeter FRAME (5 mm rim) by the wire drop window.  ANCHORS: 4 x M3 x 6 SHCS self-tap driven UP from below on a ~16.5 x 42 mm rectangle -- outboard pair at x = RETAINER_ANCHOR_RADIAL = -12.5, inboard pair at x = RETAINER_ANCHOR_RADIAL_2 = -29 (Jul 2026 4-point rework: 2 bolts on one tangential line let the saddle ROCK about that line), both at y = +/-21 so the Phi 2.5 x 3 blind floor pilots land in solid floor clear of the body cutout (half-depth 17.9) and harness drop slots; heads recessed in Phi 6 x 2 counterbores (seat z = -9; M3 x 6, shortened from x 8 because the pilot is only 3 mm deep).  CASE CAPTURE: 4 x M2.5 x 6 self-tap (96877A150) straight UP into the servo's REAL fixed back-face case holes at (x, y) = (-8.3, +/-10.2) and (-32.8, +/-10.2) -- STEP-verified; TWO prior passes wrongly bolted the Phi 2.5 four-hole crosses at the output axis, which are the DISC-HORN bolt circles, not case mounts.  Heads bear FLAT on the boss undersides (no counterbore -- keeps the Phi 12 driver cone clear).  NEVER screw into the rear idler boss: it rotates 1:1 with the output and a chassis-fixed screw there LOCKS the yaw DOF.  WIRE DROP WINDOW: cut through the backstop floor (x in [-33.3, -1], y +/-10.5) because the two 5264 bus connectors exit the case back-face centre and drop straight down.  FEET (Aug 2026 v4): FOUR full-height 8 mm square corner POLES (all tops flush with the -6 chassis belly), each ending in a Phi 12 x 3.5 ground pad, RETAINER_FOOT_H = 34 below the belly -- the front pair welds flat onto the +/-Y side-wall outer faces at x = 5.5; the rear pair sits diagonally off the rear corners at (-41.5, +/-19.5), tied in by floor-band GUSSETS whose undersides stay ABOVE the M2.5 head plane.  The whole underside is open so the case-back servo plug can be (un)mated freely (the v3 central-disk tripod blocked it, user), and every pole/pad clears the Phi 12 Phillips (M2.5) and Phi 8 hex-key (M3 anchor) driver corridors by position -- no relief carving.  History: 38 mm ground stand -> deleted in the flat-belly rework -> the robot then rested on the M2.5 boss heads and SMASHED the centre-exit yaw harness against the floor -> short feet returned (v2 C-shell -> v3 tripod -> v4 corner poles), leaving ~9 mm of protected air under the wire exits."
    qty: 6
    bounds_mm: [59.0, 54.0, 34.0]       # measured (Aug 2026 v4 rebuild, cradle-local): x in [-47.5, 11.5] (rear corner poles + Phi 12 pads reach -47.5), y in [-27, 27], z in [-40, -6] (foot tip to chassis underside).
    holes:
      - name: anchor_bolt_outboard_+Y
        diameter_mm: 3.4                # = RETAINER_BOLT_CLEAR_OD (M3 x 6 self-tap up into the chassis floor pilot; 1 of 4 on the 16.5 x 42 rectangle from chassis_lower_retainer_anchor_centres())
        position_mm: [-12.5, 21.0, -8.5]
        axis: z
    wire_channels:
      - name: wire_drop_window
        note: "Backstop-floor window (x [-33.3, -1], y +/-10.5) + 30 mm +X exit slot; passes the two 5264 bus connectors + harness exiting the case back-face centre.  (RETAINER_CABLE_SLOT_L/W = 22/20 are the LEGACY strap window -- history only.)"
    keep_out_volumes: []
    shape:
      overall_form: "U-channel saddle (walls on +/-Y and -X, +X open) under the hanging yaw servo, with a perimeter-frame backstop floor, 4 anchor-flange bosses at the top corners, 4 M2.5 case-screw bosses on the floor, and FOUR corner-pole ground feet (Phi 12 pads) 34 mm below."
      print_orientation_rationale: "v4 prints FLANGE-DOWN (180 deg X flip, print_orientation._reorient_yaw_servo_retainer): four small Phi 12 pads can't be the bed plane (feet-down floats the backstop floor ~10 mm and trips the flat-bottom guard); flange-down the broad flange is the bed and the poles print as clean vertical columns."
      features:
        - name: saddle_channel
          type: rectangular_well
          description: "3 mm-wall U-channel keyed to the case at 0.12 mm/face (SADDLE_BODY_CL); walls span the real case length (34.3 + 3 mm SADDLE_CASE_LEN_FIX)."
          centre_mm: [-12.5, 0.0, -23.0]
          length_mm: 45.6               # channel interior along x = SERVO_BODY_W + 2 * SADDLE_BODY_CL = 45.4 + 0.24
          wall_thickness_mm: 3.0        # = SADDLE_WALL_T
          axis: z
          mating_face:
            normal: +z
            mates_to: "hanging yaw STS3215 case (+/-Y and -X faces; anti-rotation key)"
        - name: backstop_floor_frame
          type: extruded_rectangle
          description: "3 mm anti-drop floor under the case back face, opened into a 5 mm perimeter rim (SADDLE_FLOOR_RIM) by the wire drop window."
          centre_mm: [-17.0, 0.0, -38.0]
          thickness_mm: 3.0             # = SADDLE_FLOOR_T
          axis: z
        - name: anchor_flange_bosses
          type: cylindrical_boss
          description: "4 M3 anchor bosses spanning z [-11, -6] (SADDLE_FLANGE_T = 5, kept thick -- heads recessed instead of thinning the flange); clearance Phi 3.4, head cb Phi 6 x 2, seat z = -9."
          centre_mm: [-12.5, 21.0, -8.5]
          diameter_mm: 6.0
          axis: z
          holes_on_feature: [anchor_bolt_outboard_+Y]
          mating_face:
            normal: +z
            mates_to: "chassis_bottom floor underside (M3 x 6 self-tap into Phi 2.5 x 3 blind pilots; pattern shared via chassis_lower_retainer_anchor_centres())"
        - name: rear_case_screw_bosses
          type: cylindrical_boss
          description: "4 Phi 6.8 bosses (SADDLE_CASE_BOSS_R = 3.4) on the floor at the servo's real back-face case holes (-8.3/-32.8, +/-10.2); M2.5 x 6 self-tap, 2.5 mm bite, heads flat on the boss undersides (no cb -- Phi 12 driver cone clearance)."
          centre_mm: [-8.3, 10.2, -38.0]
          diameter_mm: 6.8
          axis: z
        - name: corner_pole_feet
          type: cylindrical_boss
          description: "v4 (Aug 2026): FOUR 8 mm square poles (RETAINER_POLE_W), each ending in a Phi RETAINER_PAD_OD = 12 x 3.5 ground pad (0.8 chamfer), tips at z = -40 (RETAINER_FOOT_H = 34 below the -6 belly).  Front pair welds onto the +/-Y wall outer faces at (x, |y|) = RETAINER_POLE_FRONT = (5.5, 17.5); rear pair hangs off corner gussets at RETAINER_POLE_REAR = (-41.5, 19.5), placed to dodge the Phi 12 Phillips and Phi 8 hex-key driver corridors.  Open underside so the case-bottom servo plug can be (un)mated -- the v3 central Phi 30 tripod disk blocked it."
          centre_mm: [-18.0, 0.0, -38.25]
          diameter_mm: 12.0             # = RETAINER_PAD_OD (per-pole ground pad)
          height_mm: 3.5                # = RETAINER_PAD_H
          axis: z
          mating_face:
            normal: -z
            mates_to: "ground (bench rest; protects the centre-exit yaw harness with ~9 mm of air)"

  switch_holster:
    description: "Printed holster for the anti-spark XT60 on/off switch.  VELCROS flat to chassis_top's +X edge between the L0 and L5 yaw cradles (Aug 16 2026: the bolt-down mounting ear, the 2 chassis_top insert bosses, 2 M3 heat-set inserts and 2 M3 x 10 SHCS are ALL retired -- the user velcros it down).  Single-part body: a 5-walled open-top socket that snugs the switch body in with SWITCH_BODY_CL = 0.5 mm clearance per axis, toggle poking out a 14 x 10 mm cutout in the +X end wall, 2 XT60 pigtails exiting Phi 6 mm holes in the -X end wall, and a solid dead-flat 4 mm floor slab as the velcro face."
    qty: 1
    bounds_mm: [37.0, 22.0, 21.5]       # measured: SWITCH_HOLSTER_OUTER_L = SWITCH_SOCKET_OUTER_L = 32 + 1 + 4 = 37 (Aug 16 2026: the +14 mm ear retired), SWITCH_HOLSTER_OUTER_W = SWITCH_BODY_W + 2*CL + 2*WALL = 17 + 1 + 4 = 22, socket_outer_h = SWITCH_BODY_H + SWITCH_BODY_CL + SWITCH_HOLSTER_FLOOR = 17 + 0.5 + 4 = 21.5
    holes: []
    wire_channels: []
    keep_out_volumes: []
    shape:
      overall_form: "Single 5-walled open-top socket block (37 x 22 x 21.5 mm outer) that snugs the switch body; solid flat 4 mm floor = the velcro face (Aug 16 2026: the -X mounting ear retired).  Toggle cutout (14 x 10 mm) on the +X end wall; 2 Phi 6 mm XT60 pigtail bores on the -X end wall at z = floor + body_h/2 = 11 mm."
      print_orientation_rationale: "Drop the flat floor to the bed (no rotation).  Socket cavity opens +Z so the switch body drops in from above; toggle cutout and pigtail bores print as horizontal cuts through the side walls (no overhangs).  Fully solid under the cavity floor -- no bridges (the old ear air-gap bridge left with the ear)."
      features:
        - name: socket
          type: rectangular_well
          description: "The whole body (Aug 16 2026: ear retired).  Open-top 5-walled box that holds the anti-spark switch.  Inner cavity = SWITCH_BODY_L + 1 mm x SWITCH_BODY_W + 1 mm x SWITCH_BODY_H + 0.5 mm = 33 x 18 x 17.5 mm; outer = 37 x 22 x 21.5 mm.  Floor at z = SWITCH_HOLSTER_FLOOR = 4 mm (solid, flat bottom = velcro face); walls (SWITCH_HOLSTER_WALL = 2 mm) wrap the +/-X / +/-Y / +Z sides except for the toggle and pigtail cutouts."
          centre_mm: [0.0, 0.0, 10.75]    # socket_centre_x = outer_l/2 - socket_l/2 = 0 (ear retired -> socket IS the body); z mid = socket_outer_h/2 = 10.75
          length_mm: 37.0             # = HP.SWITCH_SOCKET_OUTER_L (= HP.SWITCH_BODY_L + 1 + 2*HP.SWITCH_HOLSTER_WALL)
          width_mm: 22.0              # = HP.SWITCH_HOLSTER_OUTER_W
          height_mm: 21.5             # socket_outer_h
          wall_thickness_mm: 2.0      # = HP.SWITCH_HOLSTER_WALL
        - name: toggle_cutout
          type: slot
          description: "14 x 10 mm rectangular cutout through the +X end wall of the socket so the switch's toggle lever pokes out into open air past the chassis +X vertex.  Centred vertically on the switch body at z = SWITCH_HOLSTER_FLOOR + SWITCH_BODY_H/2 = 12.5 mm."
          centre_mm: [18.5, 0.0, 12.5]    # +X end wall (x = OUTER_L/2 = 18.5 since the ear retired)
          length_mm: 2.4              # = HP.SWITCH_HOLSTER_WALL + 0.4 mm overshoot
          width_mm: 14.0              # = HP.SWITCH_TOGGLE_W
          height_mm: 10.0             # = HP.SWITCH_TOGGLE_H
        - name: xt60_pigtail_channel_pair
          type: slot
          description: "2 Phi 6 mm pigtail exit channels through the -X end wall of the socket (straight out to open deck air -- the mounting ear that used to sit beyond this wall is retired).  XT60 pigtails exit here on their way to the battery / power bus.  Centred vertically on the switch body at z = 11 mm; offset +/-5 mm in Y."
          centre_mm: [-18.5, 5.0, 11.0]   # one of 2; symmetric pair at +/-Y (-X end wall at x = -OUTER_L/2 = -18.5)
          diameter_mm: 6.0             # = HP.SWITCH_PIGTAIL_OD
          height_mm: 2.4               # = HP.SWITCH_HOLSTER_WALL + 0.4 mm overshoot
          axis: x
        # (Aug 16 2026: the mounting_ear + ear_bolt_pair features are
        #  RETIRED -- the holster velcros flat to the deck.)

  # Late-Aug 2026: the separate ``wago_mount`` tray is RETIRED -- the
  # open-top corner tray WALLS (2 side walls + outboard wall, 2.4 mm
  # thick, 6.5 mm tall) are integrated into chassis_bottom's top face
  # at each hex corner flat (outer wall flush with the plate edge at
  # chassis r = 100).  No tape, no over-edge lip, 6 fewer prints.
  # Aug 16 2026 (user: "5 slot waygos at each edge ... instead of 2 3
  # slot waygos" + "0.5-1mm tighter so I can press fit"): each corner
  # is now a SINGLE 5-port Wago 221-415 bay (a side-by-side pair of
  # 30 mm 5-slot bays would need ~67 mm; the corner flat is only
  # ~53.6 mm long) and the bay is a PRESS FIT -- WAGO_MOUNT_BAY_CLEAR
  # went +0.6 -> -0.15 (0.75 tighter, nominal interference).  The
  # centre divider left with the second bay.
  # See chassis_bottom + hexapod_prototype._chassis_wago_tray_solid.

  # Aug 2026: the ``imu_pad`` parts entry is REMOVED -- the printed pad was
  # retired in the as-built electronics pass (the MPU-6050 is glued directly
  # to chassis_bottom inboard of physical leg 1, no printed pad, no inserts)
  # but its spec entry had lingered and kept failing the stl-present check
  # for a file nobody prints or emits.

  # June 2026 disc-horn switch: the printed servo_horn_adapter has
  # been retired.  The 4 x M3 bolt-circle (Phi 3.4 mm on a 14 mm PCD)
  # and the central spline-collar recess now live directly in
  # each link's pad face (coxa_link / femur_link / tibia_link); the
  # link bolts straight onto the 20 mm aluminum 25T disc horn that
  # seats on the servo spline.  Validated by
  # ``_verify_prototype.check_horn_pattern_in_pad``.


# ---------------------------------------------------------------------
# Purchased-hardware registry (documentation ONLY -- the validator does
# not read this section; it exists so a future designer/LLM has the
# design-relevant geometry + decisions for every NON-printed part in the
# BuildViz scene without re-deriving them from hexapod_prototype.py).
# Constant names cite hexapod_prototype.py; buy specs live in docs/BOM.md;
# wiring of record is firmware/WIRING.md.
# ---------------------------------------------------------------------
hardware:

  sts3215_servo:
    qty: 18                            # + 2 spares; scene partTypes yaw_servo / hip_servo / knee_servo
    what: "FEETECH STS3215 (ST-3215-C018, 12 V / 30 kg-cm) smart serial-bus servo.  Geometry STEP-verified against FEETECH's official SO-ARM100 STS3215_03a.step."
    body: "SERVO_BODY_W/D/H = 45.4 x 24.8 x 34.3.  H is the BACK-to-FRONT mount-face (hole-plane) gap and is a FROZEN kinematic anchor -- the real case is ~2.7 mm longer; compensate locally (e.g. SADDLE_CASE_LEN_FIX = 3 on the retainer), never stretch SERVO_BODY_H globally.  Printed wells keep WELL_BODY_CL = 0.7 per face."
    output: "Output axis OFFSET to x = SERVO_OUTPUT_X = 12.5 from body centre (RESOLVED Aug 2026: 12.5 confirmed by the STEP AND by the assembled robot -- mount square, horn-cap wells, and drive-nub horn screws all land on the real servos; an old note claiming ~3.6 mm from Waveshare bracket drawings was a misreading, do not resurrect it).  FLUSH OUTPUT (Jun 2026, user-verified repeatedly): the 25T spline (Phi SERVO_SPLINE_OD = 5.9) does NOT protrude past the front face -- the Phi 20 horn cap recesses onto it.  Front mount-plate clearance bore Phi SERVO_OUTPUT_BORE_OD = 10 (coupling only; NOT big enough for the Phi 20 disc horn -- see HORN_CLEAR_OPENING_OD)."
    mount_holes: "The CASE IS THE THREAD everywhere -- no tabs, no inserts.  (a) FRONT + BACK faces: 4 x M2.5 on the SERVO_MOUNT_SQUARE = 9.8 mm square centred on the OUTPUT axis, 4 mm usable thread (SERVO_MOUNT_THREAD_DEPTH); this square doubles as the disc-horn pattern location -- TWICE a design pass mistook these output-axis crosses for a case mount (they are horn circles); the real fixed back-face case holes are at (x, y) = (4.2 | -20.3 from body centre, +/-10.25).  (b) END (+/-X) faces: 4 x M2.5 on a 10 x 10 square CENTRED on the face (SERVO_BODY_BOLT_PITCH = 10; body-centred, so independent of the output offset), M2.5 x 8 with 4 mm standoff = 4 mm bite.  (c) Front case-shell pilots: 4 x Phi 1.5 molded pilots at (4.2 | -16.5, +/-10.25), deck recessed 2.8 -- M2.5 x 6 self-tap (96877A150)."
    rear_idler_boss: "Phi REAR_BOSS_OD = 4 (comment: MEASURE on your unit) x REAR_BOSS_H = 2 boss on the back face; it ROTATES 1:1 with the output on the internal rear bearing.  The stock passive horn's centre bore rides it directly.  NEVER drive a chassis-fixed screw into it -- that locks the joint DOF."
    wire_exits: "TWO identical recessed 3-pin Molex 5264 / Mini-SPOX 2.5 mm sockets on the BACK (idler) face, centre / -X half (the +X half carries the idler hub); daisy in/out, pinout black GND / red 12 V / white-yellow signal.  With a yaw servo hanging output-up the cables leave straight DOWN.  CAD harness attach point STS3215_PORT_X/Y/Z = (-10, 0, -3); port visuals 2 x (6 x 4 x 2) boxes at y = +/-3.5.  MISTAKE GUARD: WIRE_BOOT_* (7 x 3.9 boot on the +X END) is a DS3225-era legacy stand-in -- it is NOT where STS3215 wires exit; never route from it.  Aug 2026 flatten pass: the boot box is REMOVED from the servo body model too (the knee cradle's far wall is now solid and a modeled boot would interpenetrate it); Aug 16 2026: the hip cradle's corridor went the same way (wire_exit=False), so NO live cradle cuts a boot corridor any more -- the WIRE_BOOT_* constants survive only in legacy (overridden) builders and verifier self-tests.  Also real-case geometry note: the case shell on the wire/connector (-X) end flares outward starting ~4 mm above the rear mount plane (bench-verified bump; visible in the SO-ARM100 sts3215_03a reference mesh) -- printed material next to that end face must stay below ~3.5 mm from the base (see the femur knee_rear_retention_tab riser cap)."
    wire_stabilization: "Printed features that keep the harness safe: (a) RETIRED Aug 16 2026 -- the cradle wire-exit slots (WIRE_SLOT_W = 7 x DEPTH 13.5, groove 6.5) were DS3225-era and are no longer cut anywhere (knee: Aug 2026 flatten; hip: Aug 16 2026; the STS3215 harness leaves via the back-face ports through each open clamp face); (b) zip-tie posts on every cradle, CABLE_POST_X/Y/Z = 2 x 6 x 8 offset CABLE_POST_Y_OFFSET = 7 so the post doesn't block the slot -- a snagged cable loads the zip-tie, not the connector.  INCIDENT: the coxa-bracket post's default placement was silently boolean-subtracted by the well trim and every leg shipped without bracket strain relief -- hence the BRACKET_CABLE_POST_Z_CENTRE = 20.25 override; (c) the retainer's floor window + 30 mm exit slot (the old 12 x 6 slot could not pass two 3-wire bundles + 5264 housings); (d) retainer feet keep ~9 mm of air under the back-face exits."
    current_limit: "5264 pins are rated ~3 A (stock leads 22-24 AWG).  NEVER daisy-chain power for 18 servos (~9 A walking, ~49 A multi-stall melts the first upstream connector): DATA chains leg-to-leg, POWER is injected per leg at the hip, and leg-to-leg jumpers carry signal+GND ONLY (V+ pin cut).  See firmware/WIRING.md section 6."

  disc_horn_25t:
    qty: 18                            # scene disc_horn_yaw/hip/knee; ships in 10-packs, buy 2
    what: "20 mm aluminium 25T disc horn (Amazon B07D56FVK5), the DRIVEN horn on every joint; the aluminium disc is the thread-engagement medium (M3 tapped -- no self-tap, no inserts)."
    geometry: "DISC_HORN_OD = 20, DISC_HORN_H = 2 (TRUE height above the front face -- the disc recesses onto the output boss and sits ~flush; the old model drew it 5 mm proud and caused seat errors incl. a user-visible +2 mm clevis gap).  HORN_STACK_H = 5 stays as the FROZEN kinematic output-plane offset; printed reach-down bosses bridge the 3 mm difference (HORN_REACH_DOWN = 3 generic, DRIVEN_HORN_REACH_DOWN = 5 on hip/knee yoke arms, YAW_HORN_REACH_DOWN = 9 on the coxa hub incl. bench extra-reach)."
    bolts: "4 x M3 TAPPED holes at 0/90/180/270 deg on DISC_HORN_BOLT_PCD = 14.0 -- the PCD is the bolt-circle DIAMETER; the vendor text '14 mm hole spacing' read as a 14 mm square puts holes off the disc edge (rejected).  Thread engagement = the full 2 mm disc; the reach-down boss carries the remaining grip.  Central spline screw through HORN_CENTRE_OD = 3.4.  Collar clearance: Phi DISC_HORN_COLLAR_OD = 9 x 2 recess in every pad so the disc seats FACE-to-face (Phi 9.5 x 3 in the yaw drive nub; FEMUR_HIP_HUB_RECESS_DEPTH = 4 on the femur)."
    clearance_guard: "HORN_CLEAR_OPENING_OD = 24 = DISC_HORN_OD + 4, enforced by an assert -- added after the Jun 2026 '10 mm hole for a 20 mm horn' bug where mount plates carried only the Phi 10 coupling bore."

  passive_horn_stock:
    qty: 12                            # scene passive_horn_hip/knee; ships WITH the servo -- do not buy
    what: "The STS3215's stock metal rear horn, reused as the PASSIVE support on hip + knee (same 4-hole disc pattern as the driven horn)."
    seating: "Centre bore slides directly over the Phi 4 rear idler boss and seats FLUSH on the servo back face: PASSIVE_HORN_FACE_Z = -DISC_HORN_H = -2 (joint-local, back face = 0) -- NOT -(REAR_BOSS_H + DISC_HORN_H).  INCIDENT: the retired printed centering adapter added a 2 mm standoff and the yoke measured exactly 2 mm too wide (user caliper); the refit narrowed the clevis by REAR_BOSS_H = 2.  Retention: 4 x M3 into the horn taps + one central M2.5 retention screw into the rear boss.  BACK_STACK_DEPTH = 7 stays FROZEN as the kinematic envelope (byte-identical to the 688-bearing era) even though the real horn stack is only 2 mm -- printed pad reach-down bridges it."

  yaw_bearing_6805_pair:
    qty: 12                            # 2 per leg; scene yaw_bearing_lower/upper; buy a 12+ pack for spares
    what: "6805-2RS / 61805 sealed bearing, 25 ID x 37 OD x 7 W (Aug 2026 thick-section swap; was 6706-2RS 30x37x4 -- same OD so chassis_bottom is untouched, smaller bore so every printed lip/seat got thicker); approx race bands YAW_BEARING_INNER_OD = 29 (rotating) / YAW_BEARING_OUTER_ID = 33 (stationary) -- lips/flanges must touch only their own race.  Commodity bike-bottom-bracket stock."
    why_a_pair: "The coxa cantilevers the whole leg off the yaw axis; one bearing reacts shear but not the tilting MOMENT.  Two coaxial bearings at YAW_BEARING_SPACING = 7 (mid-plane to mid-plane) turn the moment into an axial couple into chassis_bottom -- tilt stiffness scales with spacing^2 -- instead of loading the servo spline/horn.  The 7 mm-wide 6805s achieve the same 7 mm spacing sitting TOUCHING (face-to-face duplex stack; both outer rings stationary, both inner rings rotate together)."
    stack: "Coxa-local z bands (z = 0 = frozen yaw output plane): lower race [+0.5, +7.5] seated in the chassis tower's open-top pocket (FLOATING race; stands 3 mm proud of the frozen +4.5 split plane, housed by the cap bore above it); upper race [+7.5, +14.5] on the coxa hub, LOCATED by the hub's Phi 29 x 2 mm uflange + horn-bolt preload; yaw_bearing_cap's Phi 32 lip captures the upper outer race.  Both races sit ABOVE the flush horn.  YAW_TOWER_RAISE stays 14.5 (NOT bumped for the +4 mm platform rise -- bumping it would deepen the chassis cradle and force a chassis_bottom reprint; the world hip axis rises 54.65 -> 58.65 instead, propagated consistently through COXA_HIP_DROP).  Fits (Aug 16 2026 bench refit): tower + cap bore = Phi 37.15 (YAW_BEARING_PRESS = -0.075 -> +0.15 diametral clearance; exact 37.0 bound, insertable but not finger-pressable); hub boss Phi 25.15 = ID + 0.15 press (fit history: the -0.05 slip fit printed 'touching but just barely', and +0.05 still measured Phi 25.0 printed -- the side-printed boss's layer axis quantizes to 0.2 mm; +0.15 survives the process for a real ~0.1 mm press).  ASSEMBLY RULE: the stack only assembles because the tower is SPLIT -- see the yaw_bearing_cap part entry; never re-merge, and keep check_bearing_assembly_sequence green."

  tibia_cf_tube:
    qty: 6
    what: "Phi 8 OD x 6 ID roll-wrapped carbon-fibre tube, the tibia span (the femur is one printed part -- no tube since Jul 2026)."
    joints: "LEG_TUBE_SOCKET_DEPTH = 14 engagement at the yoke end plus FOOT_BOOT_SOCKET_DEPTH = 20 engagement at the boot end; both bores are Phi 8.1 -- snug slip over a thin epoxy film.  Retention is epoxy-only since Aug 2026 (the transverse pin hole is removed).  Bench remeasure: all six legs are the same length, with TIBIA_LENGTH = 150 mm from knee centre to furthest foot tip using the standard foot_boot."

  lipo_battery:
    qty: 2
    what: "3S 2200 mAh shorty LiPo (Zeee class), XT60; per-pack BATTERY_W/D/H = 75 x 34 x 26.5, ~137 g.  TWO packs wired in PARALLEL via an XT60 Y-harness (Aug 2026 -- replaces the single 138 x 46 x 24 bay pack, which was retired when it made the top deck unwieldy and would NOT fit under the belly)."
    placement: "UNDER chassis_bottom's flat belly (pack tops stick to z = -6; undersides at -32.5): block centred on the origin (BATTERY_UNDER_CENTRE), long axis yawed BATTERY_UNDER_YAW_DEG = 30 (the only orientation that clears all 6 legs' servo + retainer footprints -- exact-mesh clearance ~5 mm), packs offset +/-(34+4)/2 = +/-19 perpendicular.  Retention: industrial hook-and-loop (Dual Lock) against the belly + a safety strap through the CENTRE chassis_bottom slot pair (x = -8, y = +/-26 -- cut for the retired bay pack; slot geometry frozen so the as-printed plate is unchanged).  Both packs' XT60 leads exit the block's +axis end (az 30, r ~ 37.5), run under the belly, and climb nose-first through the 14 x 22 mm battery pass-through at (48, 0) (BATTERY_TRUNK_HOLE_*) to the Y-harness / main XT60 / anti-spark switch above.  CHASSIS_GAP shrank 32 -> 20 with the bay battery gone (see chassis_standoffs)."

  chassis_standoffs:
    qty: 4                             # scene chassis_standoff
    what: "M3 FEMALE-FEMALE brass standoffs, 20 mm (must equal CHASSIS_GAP; Aug 2026: 32 -> 20 when the battery moved under the belly -- the inter-plate bay now only clears the 11.3 mm corner Wago trays + wiring), at CHASSIS_STANDOFF_HOLES_XY = (+/-31.11, +/-31.11) -- the 44-mm-radius DIAGONAL pattern (moved off (+/-35, 0)/(0, +/-35) so the old bay battery got a straight lane)."
    why_ff: "chassis_bottom's floor stack is 8 mm thick; a male-female stud's 6 mm stud cannot span it to reach a nut.  M3 x 14 SHCS enters UP from the -6 belly into the bottom female thread; M3 x 8 SHCS drops DOWN through the (2 mm, Aug 2026) chassis_top into the top."

  hex_deck_stack:
    what: "As-built Aug 2026 electronics deck ABOVE chassis_top (the printed uno_q_tray / buck_tray / carapace / imu_pad are all retired)."
    posts: "4 posts at the SAME (+/-31.11, +/-31.11) holes: HEX_POST_STANDOFF_H = 20 M3 brass standoff + HEX_POST_THUMB_NUT_T = 2.5 knurled thumb nut (Phi 8) + Phi 8 x 8 disc magnet = HEX_POST_STACK_H = 30.5.  The magnets hold the hex mount plate (no fasteners into the plate)."
    hex_mount_plate: "Printed ROUND Phi 115 disc (Aug 2026; was a Phi 110 hex -- now matches the chassis_top disc below), 2 mm thick -- generated by tools/make_xtool_hex_raised_platform.py into extra_stl/round_mount_plate_115_with_leg_holes.stl (NOT in the validated parts registry; PRINT-ONLY -- the SVG cut file was retired in the late-Aug 2026 review round 2 because a laser-cut plate necessarily loses the underside registration bosses).  Coxa-sweep keep-out starts at r ~ 59.6 so the 57.5 radius keeps >= 2 mm (asserted at generation).  Late-Aug 2026 design review: the legacy 49.5 mm bolt square (+/-24.75) is DROPPED; only the live (+/-31.1) standoff square remains, and 4 underside bosses (OD 14, bore Phi 8.4, 2 mm tall) socket the top of each Phi 8 post magnet for SHEAR registration (gait shake goes to plastic; magnets only carry pull).  Review round 2: 3 stand-foot holes at r = 45.5, az 90/210/330 (M3 x 8 SHCS drive UP through the plate into the stand feet's blind Phi 2.5 self-tap pilots -- closes the old spec gap of 6 clearance holes with no nuts), plus the Uno Q's 3-point Arduino-UNO mount holes at (-20.3, -36.1) / (-19.0, +12.1) / (+31.8, +7.0) (the standard pattern's 4th / SE hole would land ~1.5 mm from the SE registration boss, so it is omitted; M3 x 8 down through board + plate into M3 thumb nuts, same stock as the magnet posts -- this folds the retired hex_uno_q_io_board's one useful feature into the live plate).  Also: 2 x Phi 8 wire ports at (+/-19, -44) for the underside 3.3 V Wago feed/branches, and 2 zip-tie slot pairs (8 x 3) at (+/-50, +/-7) on the E/W rim (review round 2 fix: the slots are now cut in the STL -- previously they existed only in the SVG).  Carries the Uno Q at (0, -12) + breakout at (0, +36) on top and the 3.3 V Wago underneath (WAGO_V33_CENTRE = (0, -36))."
    hex_raised_platform: "Screen stand; 'hex' is historical -- since the late-Aug 2026 review round 2 the top is a ROUND Phi 115 disc (2 mm) matching the plate below, on 3 corner blade legs (20 tangential x 7 radial, az 90/210/330; was 6) with 12 mm-square feet.  Each foot carries a blind Phi 2.5 x 7.5 self-tap pilot rising into the blade: mount = 3x M3 x 8 SHCS driven UP from under the plate (lift the plate off its magnets first).  Legs are 28 mm (filename h28; late-Aug 2026 design review shortened 72 -> 28 to cut the lever arm on the magnet-held plate -- the tool reads hp.HEX_RAISED_LEG_H directly, so the old 62/72 constant drift is fixed at the source).  Top face perfectly flat; a 24 x 5 wire slot tucks under the +X short edge of the centred 63 x 35 GMT020/ST7789 screen so the pigtail drops behind the panel.  Print feet-down (pilots print as blind holes at the bed)."

  wago_distribution:
    what: "The ENTIRE power distribution is Wago 221 lever nuts -- no PDB, no buck; the fused battery trunk feeds the trunk pair and the Uno Q directly (share ground only)."
    trunk: "2 x 5-port 221-415 (WAGO5_W/D/H = 30 x 18.6 x 8.4) at WAGO_TRUNK_CENTRE = (16, 0), +/-16 in Y on chassis_top, entries facing +X: one V+, one GND; the 6 leg branches fan out from here."
    power: "6 x 5-port 221-415 (WAGO5_W/D/H = 30 x 18.6 x 8.4), ONE press-fit per hex corner flat between the tray walls integrated into the chassis_bottom top face -- the per-leg 12 V injection points.  (Aug 16 2026, user: was 12 x 3-port 221-413 in V+/GND pairs; the two-bay tray became a single tighter 5-slot bay -- WAGO_MOUNT_BAY_CLEAR +0.6 -> -0.15.)"
    data: "6 x generic Wago (WAGO_W/D/H = 18 x 13 x 10) under the chassis at radius WAGO_DATA_R = 70 on the hex VERTEX azimuths (i*60 deg; Aug 2026 -- moved off the leg azimuths at r 48, which the under-belly battery packs now occupy) -- the leg-to-leg signal+GND-only bus splices, hung from the -6 belly."
    v33: "1 x 5-port 221-415 VHB-taped flat UNDER the round mount plate at WAGO_V33_CENTRE = (0, -36), entries facing -Y (the south rim) -- the 3.3 V rail splice.  Feed = Uno Q 3V3 pin down through the plate's east Phi 8 wire port; loads = GY-521 MPU VCC (straight down -- the nut hangs almost directly above the MPU at (2, -43)) + screen VCC (up through the west port and along the az-270 platform leg); 2 spare ports.  The plate lifts off its magnets, so the levers stay serviceable.  Hanging 8.4 below the plate it bottoms at deck0 + 22.1, clear of everything on chassis_top at that XY."

  boards:
    uno_q: "Arduino Uno Q (host + MCU), PCB UNO_Q_PCB_W/D = 68.58 x 53.34 on the standard deliberately NON-square UNO hole pattern (UNO_Q_HOLES); magnet-held hex plate at (0, -12).  Powered straight off the battery."
    breakout: "Generic 45 x 30 x 10 shield/breakout next to the Uno Q at (0, +36) on the hex plate (the source names nothing more specific)."
    bus_servo_adapter: "scene 'motor_controller' = Waveshare Bus Servo Adapter (A), 42 x 33 x 12 (MOTOR_CTRL_W/D/H) at (-24, 0) yaw 90 on chassis_top.  BOTH 42 mm edges carry connectors and need free air: +X servo-bus/UART face MOTOR_CTRL_SERVO_CLEAR = 14, -X DC-jack/USB-C face MOTOR_CTRL_PWR_CLEAR = 13 (enforced by the viz connector_clearance check).  As-built data head (Aug 2026): the Uno Q's D0/D1 TX/RX/GND pigtail lands on the UART/MCU header (+X face, jumper A); the USB-C link is bench-only because a VIN-powered Uno Q boots its USB controller in device mode AND sources no VBUS (arduino/linux-qcom#2).  Its power path handles ~5-6 A max -- bench one leg through it, never the whole robot."
    mpu6050: "GY-521 IMU, PCB 21.2 x 16.4 x 1.6, glued on CHASSIS_TOP's top face at MPU_ASBUILT_CENTRE = (2, -43), yaw 90, header row facing -X with MPU_WIRE_CLEAR = 14.  KNOWN DRIFT: a stale summary comment in hexapod_prototype.py (~40 lines above the constant) still says chassis_bottom -- the placement code + WIRING.md say chassis_top; trust the code."
    screen: "GMT020 / ST7789 status panel, SCREEN_PCB_W/D/T = 63 x 35 x 4, centred on the raised-platform top face."

  fasteners:
    note: "Every screw in the build is enumerated by fastener_registry.build_all_fastener_instances() (single source of truth; bolt-pattern CENTRES live in shared functions -- servo_clamp_bolt_centres, chassis_lower_retainer_anchor_centres, yaw_rear_screw_centres -- guarded by check_clamp_cap_alignment; never hardcode copies).  Rendered tables: docs/BOM.md 'Fasteners' via make bom-fasteners.  INCIDENT: an early model invented 72 phantom OUTPUT-face case screws -- the Phi 20 disc horn covers that face; front-face retention there is physically impossible."

# ---------------------------------------------------------------------
# Wire harness (per-leg, per-servo)
# ---------------------------------------------------------------------
# High-level shape ONLY; the per-joint numeric BOM lives in
# ``motor_setup/wire_harness_plan.py::WIRE_HARNESS_PLAN`` (18 dict
# entries) and is regenerated from the CAD geometry on every
# ``python -m motor_setup.wire_harness_plan``
# invocation.  The reach verifier
# ``_verify_prototype.check_harness_reach`` asserts the predicted
# extension-cable counts cover the actual Manhattan path lengths.
#
# Jun 2026 STS3215 serial-bus refit: the retired PWM star (one
# extension cable per servo back to two PCA9685 boards) is GONE.
# Each leg's three servos are daisy-chained with stock FEETECH 3-pin
# bus cables; the leg's bundle drops through its chassis_bottom slot
# and lands at that leg's branch terminal on the distributed POWER
# BUS BAR + Uno Q UART tap (no driver board).  A joint is addressed
# by its serial-bus ID (= joint + 1), not a board channel.  Full
# wiring of record: firmware/WIRING.md §6.
wire_harness:
  stock_bus_lead_mm: 300        # = wire_harness_plan.STOCK_PIGTAIL_MM
  extension_length_mm: 300      # = wire_harness_plan.EXTENSION_LENGTH_MM
  slack_per_joint_crossing_mm: 30  # = SLACK_PER_JOINT_CROSSING_MM
  bus:
    topology: "half-duplex TTL serial bus, 1 Mbps, daisy-chained ID1..ID18, driven directly by the Arduino Uno Q UART (no PCA9685, no Pi, no FE-URT-1/Waveshare adapter)"
    bus_bar_tray_local_centre_mm: [+64.0, +2.5]   # BUS_BAR_TRAY_X / Y_CENTRE
    bus_bar_post_pitch_mm: 8.0                     # BUS_BAR_POST_PITCH_MM
    note: "POWER is distributed: one per-leg branch terminal off the bus bar (DATA stays chained, leg-to-leg jumper = signal+GND only).  Servo ID = joint + 1."
  legs:
    - leg_idx: 0
      azimuth_deg: 30
      joints_servos:
        - { joint: 0,  axis: yaw,        servo_id: 1  }
        - { joint: 1,  axis: hip_pitch,  servo_id: 2  }
        - { joint: 2,  axis: knee,       servo_id: 3  }
    - leg_idx: 1
      azimuth_deg: 90
      joints_servos:
        - { joint: 3,  axis: yaw,        servo_id: 4  }
        - { joint: 4,  axis: hip_pitch,  servo_id: 5  }
        - { joint: 5,  axis: knee,       servo_id: 6  }
    - leg_idx: 2
      azimuth_deg: 150
      joints_servos:
        - { joint: 6,  axis: yaw,        servo_id: 7  }
        - { joint: 7,  axis: hip_pitch,  servo_id: 8  }
        - { joint: 8,  axis: knee,       servo_id: 9  }
    - leg_idx: 3
      azimuth_deg: 210
      joints_servos:
        - { joint: 9,  axis: yaw,        servo_id: 10 }
        - { joint: 10, axis: hip_pitch,  servo_id: 11 }
        - { joint: 11, axis: knee,       servo_id: 12 }
    - leg_idx: 4
      azimuth_deg: 270
      joints_servos:
        - { joint: 12, axis: yaw,        servo_id: 13 }
        - { joint: 13, axis: hip_pitch,  servo_id: 14 }
        - { joint: 14, axis: knee,       servo_id: 15 }
    - leg_idx: 5
      azimuth_deg: 330
      joints_servos:
        - { joint: 15, axis: yaw,        servo_id: 16 }
        - { joint: 16, axis: hip_pitch,  servo_id: 17 }
        - { joint: 17, axis: knee,       servo_id: 18 }
